server {
    listen       8080;
    server_name  localhost;

    gzip on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_types    text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
    gzip_vary on;

    location ~ /(api|management|v3|mock-api) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://valtimo-backend:8080;
    }

    location / {
        root   /usr/share/nginx/html;
        # Who may frame this app. This compose stack overrides the image's
        # entrypoint, so there is nothing to rewrite it at start-up: edit the
        # value here to embed locally. See docs/embedding.md.
        add_header Content-Security-Policy "frame-ancestors 'none';" always;
        try_files $uri $uri/ /index.html?$args;
    }
}
