packages:
  - frontend/plugin
  - test-app/frontend

dedupeInjectedDeps: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  "@angular/animations": 19.2.25
  "@angular/common": 19.2.25
  "@angular/compiler": 19.2.25
  "@angular/compiler-cli": 19.2.25
  "@angular/core": 19.2.25
  "@angular/elements": 19.2.25
  "@angular/forms": 19.2.25
  "@angular/localize": 19.2.25
  "@angular/platform-browser": 19.2.25
  "@angular/platform-browser-dynamic": 19.2.25
  "@angular/router": 19.2.25
  "ajv@>=8": ">=8.18.0"
  axios: ">=1.18.1"
  "brace-expansion@<2": 1.1.18
  sass: 1.98.0
  "brace-expansion@>=2": ">=5.0.9"
  devalue: ">=5.8.2"
  dompurify: ">=3.4.14"
  "fast-uri@>=3 <4": ">=3.1.6"
  "fast-uri@>=4": ">=4.1.3"
  follow-redirects: ">=1.16.0"
  form-data: ">=4.0.6"
  # swagger-ui (test-app) still pulls immutable@3; no 3.x fix for CVE-2026-59879/59880.
  # 4.3.9 is API-compatible enough for react-immutable-* / redux-immutable used there.
  immutable: 4.3.9
  # Stay on 4.x — js-yaml 5 drops the default export swagger-ui/swagger-client still import.
  "js-yaml@>=4": "4.3.1"
  jsonata: ">=2.2.2"
  lodash: ">=4.18.1"
  lodash-es: ">=4.18.1"
  morgan: ">=1.11.0"
  prismjs: ">=1.30.0"
  protocol-buffers-schema: ">=3.6.1"
  qs: ">=6.15.3"
  svelte: ">=5.55.7"
  "uuid@>=11 <12": ">=11.1.1"

allowBuilds:
  "@carbon/charts": true
  "@carbon/colors": true
  "@carbon/feature-flags": true
  "@carbon/grid": true
  "@carbon/icons": true
  "@carbon/layout": true
  "@carbon/motion": true
  "@carbon/styles": true
  "@carbon/themes": true
  "@carbon/type": true
  "@carbon/utils-position": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@tree-sitter-grammars/tree-sitter-yaml": true
  carbon-components-angular: true
  core-js: true
  core-js-pure: true
  esbuild: true
  inferno: true
  less: true
  lmdb: true
  msgpackr-extract: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

# Valtimo 13.50.0 installed on its release day, which pnpm's one-day minimumReleaseAge refuses.
# Pinned to the version so later releases still wait their day; safe to remove after 2026-10-15.
minimumReleaseAgeExclude:
  - "@valtimo/access-control-management@13.50.0"
  - "@valtimo/access-control@13.50.0"
  - "@valtimo/account@13.50.0"
  - "@valtimo/analyse@13.50.0"
  - "@valtimo/bootstrap@13.50.0"
  - "@valtimo/building-block-management@13.50.0"
  - "@valtimo/case-management@13.50.0"
  - "@valtimo/case-migration@13.50.0"
  - "@valtimo/case@13.50.0"
  - "@valtimo/choice-field@13.50.0"
  - "@valtimo/components@13.50.0"
  - "@valtimo/dashboard-management@13.50.0"
  - "@valtimo/dashboard@13.50.0"
  - "@valtimo/decision@13.50.0"
  - "@valtimo/document@13.50.0"
  - "@valtimo/form-flow-management@13.50.0"
  - "@valtimo/form-management@13.50.0"
  - "@valtimo/form@13.50.0"
  - "@valtimo/keycloak@13.50.0"
  - "@valtimo/layout@13.50.0"
  - "@valtimo/logging@13.50.0"
  - "@valtimo/migration@13.50.0"
  - "@valtimo/milestone@13.50.0"
  - "@valtimo/object-management@13.50.0"
  - "@valtimo/object@13.50.0"
  - "@valtimo/plugin-management@13.50.0"
  - "@valtimo/plugin@13.50.0"
  - "@valtimo/process-link@13.50.0"
  - "@valtimo/process-management@13.50.0"
  - "@valtimo/process@13.50.0"
  - "@valtimo/resource@13.50.0"
  - "@valtimo/security@13.50.0"
  - "@valtimo/shared@13.50.0"
  - "@valtimo/sse@13.50.0"
  - "@valtimo/swagger@13.50.0"
  - "@valtimo/task-management@13.50.0"
  - "@valtimo/task@13.50.0"
  - "@valtimo/teams@13.50.0"
