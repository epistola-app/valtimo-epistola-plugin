packages:
  - frontend/plugin
  - test-app/frontend
  - .agents/mcp/*

dedupeInjectedDeps: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  "@angular/animations": 19.2.25
  "@angular/common": 19.2.25
  "@angular/compiler": 19.2.25
  "@angular/compiler-cli": 19.2.25
  "@angular/core": 19.2.25
  "@angular/elements": 19.2.25
  "@angular/forms": 19.2.25
  "@angular/localize": 19.2.25
  "@angular/platform-browser": 19.2.25
  "@angular/platform-browser-dynamic": 19.2.25
  "@angular/router": 19.2.25
  "ajv@>=8": ">=8.18.0"
  axios: ">=1.20.0"
  "brace-expansion@<2": 1.1.21
  sass: 1.98.0
  # sass 1.98.0 resolves source-map-js 1.2.1; 1.2.2 carries the fix.
  source-map-js: ">=1.2.2"
  "brace-expansion@>=2": ">=5.0.12"
  devalue: "^5.9.3"
  dompurify: ">=3.4.17"
  "fast-uri@>=3 <4": ">=3.1.6"
  "fast-uri@>=4": ">=4.2.3"
  follow-redirects: ">=1.16.2"
  form-data: ">=4.0.6"
  # swagger-ui (test-app) still pulls immutable@3; no 3.x fix for CVE-2026-59879/59880.
  # 4.3.9 is API-compatible enough for react-immutable-* / redux-immutable used there.
  immutable: 4.3.9
  # Stay on 4.x — js-yaml 5 drops the default export swagger-ui/swagger-client still import.
  "js-yaml@>=4": "4.3.2"
  jsonata: ">=2.2.2"
  lodash: ">=4.18.1"
  lodash-es: ">=4.18.1"
  # @discourse/mcp (the .agents discourse tool) pins 1.30.0 exactly; 1.32.0 fixes its advisories.
  "@modelcontextprotocol/sdk": ">=1.32.0"
  # Valtimo pins moment 2.30.1; 2.31.0 is a compatible minor that carries the fix.
  moment: ">=2.31.0"
  morgan: ">=1.12.1"
  prismjs: ">=1.30.0"
  protocol-buffers-schema: ">=3.6.1"
  qs: ">=6.16.1"
  svelte: ">=5.55.7"
  "uuid@>=11 <12": ">=11.1.1"

allowBuilds:
  "@carbon/charts": true
  "@carbon/colors": true
  "@carbon/feature-flags": true
  "@carbon/grid": true
  "@carbon/icons": true
  "@carbon/layout": true
  "@carbon/motion": true
  "@carbon/styles": true
  "@carbon/themes": true
  "@carbon/type": true
  "@carbon/utils-position": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@tree-sitter-grammars/tree-sitter-yaml": true
  carbon-components-angular: true
  core-js: true
  core-js-pure: true
  esbuild: true
  inferno: true
  keytar: true
  less: true
  lmdb: true
  msgpackr-extract: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

# Valtimo 13.54.0 was installed the day after its release, inside pnpm's one-day minimumReleaseAge.
# Pinned to the version so later releases still wait their day; safe to remove after 2026-11-13.
minimumReleaseAgeExclude:
  - "@valtimo/access-control-management@13.54.0"
  - "@valtimo/access-control@13.54.0"
  - "@valtimo/account@13.54.0"
  - "@valtimo/analyse@13.54.0"
  - "@valtimo/bootstrap@13.54.0"
  - "@valtimo/building-block-management@13.54.0"
  - "@valtimo/case-management@13.54.0"
  - "@valtimo/case-migration@13.54.0"
  - "@valtimo/case@13.54.0"
  - "@valtimo/choice-field@13.54.0"
  - "@valtimo/components@13.54.0"
  - "@valtimo/dashboard-management@13.54.0"
  - "@valtimo/dashboard@13.54.0"
  - "@valtimo/decision@13.54.0"
  - "@valtimo/document@13.54.0"
  - "@valtimo/form-flow-management@13.54.0"
  - "@valtimo/form-management@13.54.0"
  - "@valtimo/form@13.54.0"
  - "@valtimo/keycloak@13.54.0"
  - "@valtimo/layout@13.54.0"
  - "@valtimo/logging@13.54.0"
  - "@valtimo/migration@13.54.0"
  - "@valtimo/milestone@13.54.0"
  - "@valtimo/object-management@13.54.0"
  - "@valtimo/object@13.54.0"
  - "@valtimo/plugin-management@13.54.0"
  - "@valtimo/plugin@13.54.0"
  - "@valtimo/process-link@13.54.0"
  - "@valtimo/process-management@13.54.0"
  - "@valtimo/process@13.54.0"
  - "@valtimo/resource@13.54.0"
  - "@valtimo/security@13.54.0"
  - "@valtimo/shared@13.54.0"
  - "@valtimo/sse@13.54.0"
  - "@valtimo/swagger@13.54.0"
  - "@valtimo/task-management@13.54.0"
  - "@valtimo/task@13.54.0"
  - "@valtimo/teams@13.54.0"
