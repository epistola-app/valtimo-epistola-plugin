<ng-container *ngFor="let group of groups; trackBy: trackGroup">
  <div class="function-reference__group" role="group">
    <div class="function-reference__group-label" [attr.title]="group.description">
      {{ group.signature }}
    </div>
    <div
      *ngFor="let option of group.options; trackBy: trackOption"
      class="function-reference__row"
      [style.padding-left.rem]="option.schemaField.depth * 1.1"
    >
      <button
        *ngIf="option.schemaField.expandable"
        type="button"
        class="function-reference__expand"
        [attr.aria-label]="option.label"
        [attr.aria-expanded]="option.expanded"
        (mousedown)="toggleField.emit({ event: $event, option: option })"
      >
        {{ option.expanded ? '&#x25BC;' : '&#x25B6;' }}
      </button>
      <span *ngIf="!option.schemaField.expandable" class="function-reference__expand"></span>
      <button
        type="button"
        class="function-reference__option"
        role="option"
        [disabled]="option.insertable === false"
        [class.function-reference__option--active]="activeOption === option"
        [attr.aria-selected]="activeOption === option"
        [attr.title]="option.description || group.description"
        (mousedown)="optionMouseDown.emit({ event: $event, option: option })"
        (click)="optionClick.emit(option)"
      >
        <span>
          {{ option.schemaField.name }}
          <small>
            {{ option.schemaField.type }}
            <ng-container *ngIf="option.schemaField.required"> · required</ng-container>
            <ng-container *ngIf="!option.schemaField.required"> · optional</ng-container>
            <ng-container *ngIf="option.schemaField.nullable"> · nullable</ng-container>
          </small>
          <small *ngIf="option.description">{{ option.description }}</small>
        </span>
        <code>{{ option.expression }}</code>
      </button>
    </div>
  </div>
</ng-container>

<div *ngFor="let diagnostic of diagnostics" class="function-reference__diagnostic" role="status">
  <strong>{{ diagnostic.signature }}</strong
  >: {{ diagnostic.message }}
</div>
