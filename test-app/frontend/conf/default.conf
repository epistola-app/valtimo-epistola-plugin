server {
    listen       8080;
    server_name  localhost;

    gzip on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_types    text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
    gzip_vary on;

    location ~ /(api|management|v3|mock-api) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://valtimo-backend:8080;
    }

    # Hashed assets (JS, CSS) — cache aggressively
    location ~* "\.[0-9a-f]{16,}\.(js|css)$" {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
        # Never cache index.html — it contains references to hashed assets
        add_header Cache-Control "no-cache";
        # Who may frame this app. Rewritten at container start by
        # docker-entrypoint.sh when embedding is configured; 'none' otherwise.
        # Scoped to this location on purpose: nginx drops an inherited
        # add_header wherever a location declares one of its own, and the API
        # proxy below must keep serving PDFs that the app frames itself.
        add_header Content-Security-Policy "frame-ancestors 'none';" always;
        # ensure all request go to javascript/angular in index.html
        try_files $uri $uri/ /index.html?$args;
    }
}
