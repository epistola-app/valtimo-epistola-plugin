name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: matrix.language == 'java-kotlin'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Build backend (java-kotlin only)
        if: matrix.language == 'java-kotlin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-build-cache forces compilation to actually run so CodeQL can
        # trace javac/kotlinc and populate the extraction database. Without
        # this, a warm Gradle build cache makes the build a no-op and the
        # finalize step fails with "could not process any of it".
        run: ./gradlew :backend:plugin:assemble -x test --no-build-cache

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:${{ matrix.language }}
