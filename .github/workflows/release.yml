name: Release

# Publishes a release of the plugin: the backend to Maven Central, the frontend to npm, and the
# test-app's demo images. It does not test: a release is only made from a commit whose CI run
# passed (the ci-gate job), which already ran every check this workflow used to repeat. Before
# anything is published it refuses a version that npm or Maven Central has ever seen, because
# neither lets a published version be replaced (npm not even after an unpublish), and a clash
# found halfway leaves the release on one registry and not the other.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.1). Required for re-runs."
        required: true
        type: string
      resume:
        description: "Finish a release that was partly published: allow a version a registry already has, and skip publishing there."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  VERSION: ""

jobs:
  version:
    name: Resolve version
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release version: ${VERSION}"
            exit 1
          fi

          # A pre-release (X.Y.Z-alpha.1) is published beside the stable line, never in its place:
          # npm gets a dist-tag named after its identifier (alpha, beta, rc) instead of `latest`,
          # the images keep their exact tag only (no moving X.Y), and the demo stays where it is.
          CORE="${VERSION%%-*}"
          MAJOR_MINOR="${CORE%.*}"
          if [ "$CORE" != "$VERSION" ]; then
            PRERELEASE=true
            PRE="${VERSION#*-}"
            NPM_TAG="${PRE%%.*}"
            if ! printf '%s\n' "$NPM_TAG" | grep -Eq '^[A-Za-z][0-9A-Za-z-]*$' || [ "$NPM_TAG" = "latest" ]; then
              echo "::error::Pre-release ${VERSION} must start with a name (alpha, beta, rc), not '${NPM_TAG}'"
              exit 1
            fi
          else
            PRERELEASE=false
            NPM_TAG=latest
          fi

          {
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "prerelease=${PRERELEASE}"
            echo "npm_tag=${NPM_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (pre-release: ${PRERELEASE}, npm dist-tag: ${NPM_TAG})"

      # npm keeps an unpublished version's number reserved forever and lists it only under
      # `time`, not `versions`: 1.0.0 failed exactly this way, after Maven Central already had
      # it. Maven Central's search lags a publish by up to half an hour, so a release published
      # moments ago can slip past; the publish then fails there before npm is reached.
      - name: Check the version is unused
        if: ${{ !inputs.resume }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm_code=$(curl -sS -o npm.json -w '%{http_code}' https://registry.npmjs.org/@epistola.app%2fvaltimo-plugin)
          case "$npm_code" in
            200) if jq -e --arg v "$VERSION" '.time[$v]' npm.json >/dev/null; then
                   echo "::error::npm has seen @epistola.app/valtimo-plugin@${VERSION} before (published, or published and unpublished): it can never be published again. Release a new version."
                   exit 1
                 fi ;;
            404) ;;
            *) echo "::error::Could not ask npm whether ${VERSION} is taken (HTTP ${npm_code})"; exit 1 ;;
          esac

          maven_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/app/epistola/valtimo/epistola-plugin/${VERSION}/epistola-plugin-${VERSION}.pom")
          case "$maven_code" in
            200) echo "::error::Maven Central already has app.epistola.valtimo:epistola-plugin:${VERSION}. Release a new version, or re-run with resume to finish a partial release."
                 exit 1 ;;
            404) ;;
            *) echo "::error::Could not ask Maven Central whether ${VERSION} is taken (HTTP ${maven_code})"; exit 1 ;;
          esac
          echo "${VERSION} is free on npm and Maven Central"

  ci-gate:
    name: CI passed for this commit
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      # CI runs on every push to main and is a superset of what a release used to re-run here
      # (the plugin build with oldestSupportedServerTest, the test-app E2E, every frontend
      # check), so a green run for this exact commit is the test. Waiting covers a release made
      # right after its commit was pushed. CI cancels a run superseded by a newer push, so an
      # older commit may have no green run: re-run its CI, or release the newer commit.
      - name: Wait for a successful CI run of ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 80); do
            runs=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=50" \
              --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              echo "CI passed: $(jq -r '[.[] | select(.conclusion == "success")][0].url' <<<"$runs")"
              exit 0
            fi
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -gt 0 ]; then
              echo "CI is still running for ${SHA} (check ${attempt})"
              sleep 30
              continue
            fi
            echo "::error::No successful CI run for ${SHA}. Runs found: $(jq -c '[.[] | .conclusion]' <<<"$runs")"
            exit 1
          done
          echo "::error::CI did not finish for ${SHA} within 40 minutes"
          exit 1

  publish-backend:
    name: Publish Backend to Maven Central
    needs: [version, ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Generate backend SBOM
        run: ./gradlew :backend:plugin:cyclonedxBom -Pversion=${{ needs.version.outputs.version }}

      - name: Upload backend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-backend
          path: backend/plugin/build/reports/bom.json
          retention-days: 7
          if-no-files-found: error

      - name: Already on Maven Central?
        id: existing
        if: ${{ inputs.resume }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/app/epistola/valtimo/epistola-plugin/${VERSION}/epistola-plugin-${VERSION}.pom")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        if: steps.existing.outputs.published != 'true'
        run: ./gradlew :backend:plugin:publishAndReleaseToMavenCentral -Pversion=${{ needs.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

  publish-frontend:
    name: Publish Frontend to npm
    needs: [version, ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.2
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm --filter @epistola.app/valtimo-plugin build

      - name: Generate frontend SBOM into dist
        run: pnpm sbom:plugin

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-frontend
          path: frontend/plugin/dist/sbom.json
          retention-days: 7
          if-no-files-found: error

      - name: Already on npm?
        id: existing
        if: ${{ inputs.resume }}
        run: |
          curl -sS https://registry.npmjs.org/@epistola.app%2fvaltimo-plugin -o npm.json
          if jq -e --arg v "${{ needs.version.outputs.version }}" '.versions[$v]' npm.json >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version and publish
        if: steps.existing.outputs.published != 'true'
        working-directory: frontend/plugin/dist
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public --tag "${{ needs.version.outputs.npm_tag }}"

  # The images build from source, not from the published packages, so they start as soon as CI
  # is confirmed instead of after publishing.
  docker-backend:
    name: Docker Backend
    needs: [version, ci-gate]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/epistola-app/valtimo/demo-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build WAR
        run: ./gradlew :test-app:backend:bootWar -Pversion=${{ needs.version.outputs.version }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: test-app/backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.prerelease != 'true' && format('{0}:{1}', env.IMAGE, needs.version.outputs.major_minor) || '' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

  docker-frontend:
    name: Docker Frontend
    needs: [version, ci-gate]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/epistola-app/valtimo/demo-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm --filter @epistola.app/valtimo-plugin build

      - name: Build test-app
        run: pnpm --filter gzac-frontend-template build

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: test-app/frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.prerelease != 'true' && format('{0}:{1}', env.IMAGE, needs.version.outputs.major_minor) || '' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

  scan-backend-image:
    name: Scan backend image
    needs: [version, docker-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/epistola-app/valtimo/demo-backend:${{ needs.version.outputs.version }}
          format: sarif
          output: trivy-image-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-image-backend.sarif
          category: trivy-image-backend

  scan-frontend-image:
    name: Scan frontend image
    needs: [version, docker-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/epistola-app/valtimo/demo-frontend:${{ needs.version.outputs.version }}
          format: sarif
          output: trivy-image-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-image-frontend.sarif
          category: trivy-image-frontend

  update-release:
    name: Update GitHub Release
    needs: [version, publish-backend, publish-frontend, docker-backend, docker-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Update release body with install instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          RELEASE_TAG="v${VERSION}"
          gh release view "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq .body > release-notes.md
          sed -i \
            '/<!-- epistola-install-instructions:start -->/,/<!-- epistola-install-instructions:end -->/d' \
            release-notes.md

          cat >> release-notes.md <<EOF

          <!-- epistola-install-instructions:start -->
          ## v${VERSION}

          ### Maven (backend plugin)
          \`\`\`xml
          <dependency>
              <groupId>app.epistola.valtimo</groupId>
              <artifactId>epistola-plugin</artifactId>
              <version>${VERSION}</version>
          </dependency>
          \`\`\`

          ### Gradle (Kotlin DSL)
          \`\`\`kotlin
          implementation("app.epistola.valtimo:epistola-plugin:${VERSION}")
          \`\`\`

          ### npm (frontend plugin)
          \`\`\`bash
          npm install @epistola.app/valtimo-plugin@${VERSION}
          \`\`\`

          ### Docker images
          \`\`\`
          ghcr.io/epistola-app/valtimo/demo-backend:${VERSION}
          ghcr.io/epistola-app/valtimo/demo-frontend:${VERSION}
          \`\`\`

          ### Software Bill of Materials (CycloneDX)
          The release assets include CycloneDX SBOMs for both the backend and
          frontend plugin. The backend SBOM is also published to Maven Central
          as the \`cyclonedx\` classifier; the frontend SBOM is bundled inside
          the published npm tarball at \`sbom.json\`.
          <!-- epistola-install-instructions:end -->
          EOF

          gh release edit "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md

      - name: Mark a pre-release as one
        if: needs.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Kept off "Latest" even when it was published without the box ticked.
          gh release edit "v${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --prerelease --latest=false

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sbom-*
          path: ./sboms

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cp sboms/sbom-backend/bom.json "epistola-plugin-${VERSION}-backend-sbom.json"
          cp sboms/sbom-frontend/sbom.json "epistola-plugin-${VERSION}-frontend-sbom.json"
          gh release upload "v${VERSION}" \
            "epistola-plugin-${VERSION}-backend-sbom.json" \
            "epistola-plugin-${VERSION}-frontend-sbom.json" \
            --repo "${{ github.repository }}" \
            --clobber
