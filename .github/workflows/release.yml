name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.1). Required for re-runs."
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  VERSION: ""

jobs:
  version:
    name: Resolve version
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release version: ${VERSION}"
            exit 1
          fi

          MAJOR_MINOR="${VERSION%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

  build:
    name: Build & Test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & test backend
        run: ./gradlew :backend:plugin:build :backend:plugin:cyclonedxBom :test-app:backend:test -Pversion=${{ needs.version.outputs.version }}

      - name: Check frontend
        run: |
          pnpm lint:check
          pnpm format:check
          pnpm license:check
          pnpm typecheck
          pnpm singletons:check
          pnpm --filter @epistola.app/valtimo-plugin test

      - name: Build frontend plugin and consumer
        run: |
          pnpm --filter @epistola.app/valtimo-plugin build
          pnpm --filter gzac-frontend-template build

      - name: Generate frontend SBOM
        run: pnpm sbom:plugin

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sboms
          path: |
            backend/plugin/build/reports/bom.json
            frontend/plugin/dist/sbom.json
          retention-days: 7
          if-no-files-found: error

  publish-backend:
    name: Publish Backend to Maven Central
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Publish to Maven Central
        run: ./gradlew :backend:plugin:publishAndReleaseToMavenCentral -Pversion=${{ needs.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

  publish-frontend:
    name: Publish Frontend to npm
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm --filter @epistola.app/valtimo-plugin build

      - name: Generate frontend SBOM into dist
        run: pnpm sbom:plugin

      - name: Set version and publish
        working-directory: frontend/plugin/dist
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public

  docker-backend:
    name: Docker Backend
    needs: [version, publish-backend]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/epistola-app/valtimo/demo-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build WAR
        run: ./gradlew :test-app:backend:bootWar -Pversion=${{ needs.version.outputs.version }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: test-app/backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.version.outputs.major_minor }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

  docker-frontend:
    name: Docker Frontend
    needs: [version, publish-frontend]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/epistola-app/valtimo/demo-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm --filter @epistola.app/valtimo-plugin build

      - name: Build test-app
        run: pnpm --filter gzac-frontend-template build

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: test-app/frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.version.outputs.major_minor }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

  scan-backend-image:
    name: Scan backend image
    needs: [version, docker-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/epistola-app/valtimo/demo-backend:${{ needs.version.outputs.version }}
          format: sarif
          output: trivy-image-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-image-backend.sarif
          category: trivy-image-backend

  scan-frontend-image:
    name: Scan frontend image
    needs: [version, docker-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/epistola-app/valtimo/demo-frontend:${{ needs.version.outputs.version }}
          format: sarif
          output: trivy-image-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-image-frontend.sarif
          category: trivy-image-frontend

  promote-demo:
    name: Trigger demo pin bump
    needs: [version, docker-backend, docker-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger infra pin bump
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          # Pin only after both images have been published and signed. --ref main
          # avoids a default-branch metadata lookup that an Actions-only token
          # cannot perform.
          gh workflow run app-pin-bump.yml \
            -R epistola-app/epistola-nix-infra \
            --ref main \
            -f app=valtimo \
            -f tag="${{ needs.version.outputs.version }}"

  update-release:
    name: Update GitHub Release
    needs: [version, docker-backend, docker-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Update release body with install instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          RELEASE_TAG="v${VERSION}"
          gh release view "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq .body > release-notes.md
          sed -i \
            '/<!-- epistola-install-instructions:start -->/,/<!-- epistola-install-instructions:end -->/d' \
            release-notes.md

          cat >> release-notes.md <<EOF

          <!-- epistola-install-instructions:start -->
          ## v${VERSION}

          ### Maven (backend plugin)
          \`\`\`xml
          <dependency>
              <groupId>app.epistola.valtimo</groupId>
              <artifactId>epistola-plugin</artifactId>
              <version>${VERSION}</version>
          </dependency>
          \`\`\`

          ### Gradle (Kotlin DSL)
          \`\`\`kotlin
          implementation("app.epistola.valtimo:epistola-plugin:${VERSION}")
          \`\`\`

          ### npm (frontend plugin)
          \`\`\`bash
          npm install @epistola.app/valtimo-plugin@${VERSION}
          \`\`\`

          ### Docker images
          \`\`\`
          ghcr.io/epistola-app/valtimo/demo-backend:${VERSION}
          ghcr.io/epistola-app/valtimo/demo-frontend:${VERSION}
          \`\`\`

          ### Software Bill of Materials (CycloneDX)
          The release assets include CycloneDX SBOMs for both the backend and
          frontend plugin. The backend SBOM is also published to Maven Central
          as the \`cyclonedx\` classifier; the frontend SBOM is bundled inside
          the published npm tarball at \`sbom.json\`.
          <!-- epistola-install-instructions:end -->
          EOF

          gh release edit "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sboms
          path: ./sboms

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cp sboms/backend/plugin/build/reports/bom.json "epistola-plugin-${VERSION}-backend-sbom.json"
          cp sboms/frontend/plugin/dist/sbom.json "epistola-plugin-${VERSION}-frontend-sbom.json"
          gh release upload "v${VERSION}" \
            "epistola-plugin-${VERSION}-backend-sbom.json" \
            "epistola-plugin-${VERSION}-frontend-sbom.json" \
            --repo "${{ github.repository }}" \
            --clobber
